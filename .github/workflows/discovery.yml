name: Update discovery index

# Rebuilds docs/discovery/index.json whenever discovery sounds, ballades or maps are added, renamed or removed,
# so every app (web player, iPhone and iPad, Android, Ballade, Map) sees them without editing any list by hand.
on:
  push:
    branches: [main]
    paths:
      - "docs/discovery/**"
      - ".github/scripts/build_discovery_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discovery-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.json
        run: python3 .github/scripts/build_discovery_index.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/discovery/index.json; then
            echo "index.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/discovery/index.json
          git commit -m "Update discovery index"
          git pull --rebase origin main
          git push origin HEAD:main
