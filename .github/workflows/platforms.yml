name: Platform contract

# 261118_troubadour_unifier.md: tokens built from their one source, one palette, every offline app keeps what it
# loads, the words of the charter. Fails the push or the pull request when one of them breaks.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check_platforms.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The statecharts of the unifier (section 4) as tests: every event in every state.
      - run: node tests/statecharts/run.mjs
