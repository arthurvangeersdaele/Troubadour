name: Map editor

# 261114_map_plan.md, M3 and M4: the editor listens from the golden point (Heard now), and has the codes of an
# editor (undo and redo for everything, clipboard, snapping, the reach handle, the page of keys).
on:
  push:
    paths: ['docs/map/**', 'docs/map-preview/**', 'docs/shared/**', 'docs/ios/**', 'docs/play/**', 'tests/map/**', 'tests/intro/**', '.github/workflows/map-editor.yml']
  workflow_dispatch:

jobs:
  listen:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium for ubuntu 26.04 (ubuntu-latest)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright and Chromium
        working-directory: tests/ballade
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Heard now
        run: node tests/map/listen.mjs
      - name: The codes of an editor
        run: node tests/map/editor.mjs
      - name: The music follows the party (a walk of 40 stops)
        run: node tests/map/music-walk.mjs 40
      - name: The intro and the outro
        run: node tests/map/intro-outro.mjs
      - name: Sounds of the computer (the tray, the drop zones, a drop on a place)
        run: node tests/map/drop.mjs
      - name: The toolbar of the editor (path, places armed, selection, tooltips)
        run: node tests/map/toolbar.mjs
      - name: The intro and the outro of a story (Troubadour for iPhone, web player)
        run: node tests/intro/run.mjs
