name: Ballade sound lab

# 261114_ballade_plan.md, phases 0 and 1: plays every card of the Ballade discovery tales through the Ballade
# engine and fails on a loop hole, a seam click, a hard start or a hard stop. The report is kept as an artifact.
on:
  push:
    paths: ['docs/ballade/**', 'tests/ballade/**', '.github/workflows/ballade-lab.yml']
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium for ubuntu 26.04 (ubuntu-latest)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright and Chromium
        working-directory: tests/ballade
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run the lab
        working-directory: tests/ballade
        run: |
          set -o pipefail
          node run.mjs | tee lab.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ballade-lab-report
          path: |
            tests/ballade/report.json
            tests/ballade/lab.txt
