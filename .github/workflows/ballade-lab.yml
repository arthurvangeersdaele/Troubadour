name: Ballade sound lab

# Phase 0 of 261114_ballade_plan.md: measures gaps, loop seams and clicks in the Ballade discovery tales.
# Report-only for now (it never fails the push); the report is kept as an artifact of each run.
on:
  push:
    paths: ['docs/ballade/**', 'tests/ballade/**', '.github/workflows/ballade-lab.yml']
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright and Chromium
        working-directory: tests/ballade
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run the lab
        working-directory: tests/ballade
        run: node run.mjs | tee lab.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ballade-lab-report
          path: |
            tests/ballade/report.json
            tests/ballade/lab.txt
