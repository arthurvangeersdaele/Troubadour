<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ballade sound lab</title>
</head>
<body>
<!-- Ballade sound lab (phase 0 of 261114_ballade_plan.md).
     Opened by run.mjs in headless Chromium, served from the repo root. It reads a .troubadour-ballade file,
     decodes every sound used by its cards and measures what makes today's player not gapless:
     silence at the ends of each file (heard at every loop turn), the jump at the loop seam (a click),
     hard starts and hard stops. Nothing is played aloud: renders go through OfflineAudioContext. -->
<script src="../../docs/troupe/troubadour-format.js"></script>
<script src="../../docs/ballade/flow-format.js"></script>
<script>
(function () {
  'use strict';
  const RATE = 44100;
  const SILENT = Math.pow(10, -60 / 20); // -60 dBFS
  const CLICK = 0.02;                    // a jump bigger than this between two samples at a seam is heard

  const dec = (ab) => new Promise((ok, ko) => {
    const c = new OfflineAudioContext(2, 1, RATE);
    const r = c.decodeAudioData(ab, ok, ko); if (r && r.catch) r.catch(ko);
  });

  /** First and last audible sample (any channel). */
  function edges(buf) {
    const ch = [...Array(buf.numberOfChannels).keys()].map((k) => buf.getChannelData(k));
    const n = buf.length;
    let a = 0; while (a < n && ch.every((d) => Math.abs(d[a]) < SILENT)) a++;
    let b = n - 1; while (b > a && ch.every((d) => Math.abs(d[b]) < SILENT)) b--;
    return { lead: a, trail: n - 1 - b, first: a, last: b, ch };
  }

  /** Renders three turns of a loop the way today's player loops (loopStart = start, loopEnd = end of file)
   *  and returns the longest silent run and the biggest sample jump found at the seams. */
  async function renderLoop(buf, start) {
    const turns = 3;
    const len = Math.min(Math.ceil((buf.duration - start) * turns * RATE), RATE * 60 * 12);
    const c = new OfflineAudioContext(buf.numberOfChannels, len, RATE);
    const s = c.createBufferSource();
    s.buffer = buf; s.loop = true; s.loopStart = start; s.loopEnd = buf.duration;
    s.connect(c.destination); s.start(0, start);
    const out = await c.startRendering();
    const d = out.getChannelData(0);
    let run = 0, longest = 0;
    for (let i = 0; i < d.length; i++) { if (Math.abs(d[i]) < SILENT) { run++; if (run > longest) longest = run; } else run = 0; }
    const period = Math.round((buf.duration - start) * RATE);
    let jump = 0;
    for (let k = 1; k < turns; k++) { const i = k * period; if (i < d.length) jump = Math.max(jump, Math.abs(d[i] - d[i - 1])); }
    return { longestSilenceMs: Math.round(longest / RATE * 1000), seamJump: +jump.toFixed(4) };
  }

  window.runLab = async function (url) {
    const blob = await (await fetch(url)).blob();
    const { story, flow, files } = await window.TroubadourBallade.read(new File([blob], url.split('/').pop()));
    const cards = [];
    const walk = (steps, where) => (steps || []).forEach((s, i) => (s.cards || []).forEach((c) => cards.push({ c, where: `${where} step ${i + 1}` })));
    (flow.chapters || []).forEach((ch, n) => {
      walk(ch.steps, `ch${n + 1}`);
      const ways = (ch.choice && ch.choice.answers) || [];
      ways.forEach((a, k) => walk(a.steps, `ch${n + 1} way ${k + 1}`));
    });
    const sounds = {};
    for (const [path, b] of files) {
      try {
        const buf = await dec(await b.arrayBuffer());
        const e = edges(buf);
        sounds[path] = { buf, seconds: +buf.duration.toFixed(2), leadMs: Math.round(e.lead / buf.sampleRate * 1000), trailMs: Math.round(e.trail / buf.sampleRate * 1000),
          firstAmp: +Math.max(...e.ch.map((d) => Math.abs(d[e.first] || 0))).toFixed(3), lastAmp: +Math.max(...e.ch.map((d) => Math.abs(d[e.last] || 0))).toFixed(3) };
      } catch (err) { sounds[path] = { error: String(err) }; }
    }
    const findings = [];
    for (const { c, where } of cards) {
      const s = sounds[c.file];
      if (!s || s.error) { findings.push({ where, name: c.name, kind: 'undecodable', detail: s ? s.error : 'missing' }); continue; }
      const loops = c.play === 'loop' || c.repeat || c.hold;
      if (loops) {
        const r = await renderLoop(s.buf, c.start || 0);
        const gap = s.leadMs + s.trailMs;
        if (r.longestSilenceMs > 10 || gap > 10) findings.push({ where, name: c.name, kind: 'loop gap', gapMs: Math.max(gap, r.longestSilenceMs) });
        if (r.seamJump > CLICK) findings.push({ where, name: c.name, kind: 'loop seam click', jump: r.seamJump });
      }
      if (!(c.fadeIn > 0) && !(c.start > 0) && s.leadMs < 2 && s.firstAmp > CLICK) findings.push({ where, name: c.name, kind: 'hard start', amp: s.firstAmp });
      const cutsEarly = !loops && c.duration + (c.start || 0) < s.seconds - 0.05;
      if (!(c.fadeOut > 0) && cutsEarly) findings.push({ where, name: c.name, kind: 'hard stop (cut mid-sound without fade)' });
    }
    const list = Object.entries(sounds).map(([p, s]) => Object.assign({ file: p }, s, { buf: undefined }));
    return { story: story.title, cards: cards.length, sounds: list.length, findings, soundsDetail: list };
  };
  window.labReady = true;
})();
</script>
</body>
</html>
